<svg xmlns="http://www.w3.org/2000/svg" width="840" height="650" viewBox="0 0 840 650" fill="none" role="img" aria-labelledby="mac-rental-title mac-rental-description">
  <title id="mac-rental-title">Vermietung auf dem Mac, klar miteinander verbunden</title>
  <desc id="mac-rental-description">Eine stilisierte Mac-Anwendung zeigt eine ruhige Seitenleiste und drei verbundene Bereiche: Immobilie, Mietvertrag und Mietkonto. Eine gezeichnete Immobilie, ein Vertragsdokument und ein geordnetes Mietkonto verdeutlichen den Zusammenhang ohne persönliche Daten oder Beispielbeträge.</desc>
  <defs>
    <linearGradient id="device-rim" x1="420" y1="76" x2="420" y2="555" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18324A"/>
      <stop offset="1" stop-color="#2D3742"/>
    </linearGradient>
    <linearGradient id="device-stand" x1="420" y1="546" x2="420" y2="613" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FB3A5"/>
      <stop offset="1" stop-color="#E5EAED"/>
    </linearGradient>
    <filter id="device-shadow" x="0" y="50" width="840" height="560" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#18324A" flood-opacity=".12"/>
    </filter>
    <filter id="card-shadow" x="250" y="235" width="540" height="260" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#18324A" flood-opacity=".045"/>
    </filter>
    <clipPath id="screen-clip"><rect x="44" y="94" width="752" height="432" rx="12"/></clipPath>
  </defs>

  <!-- A grounded desktop silhouette; the content is an illustration, not a screenshot. -->
  <ellipse cx="420" cy="615" rx="176" ry="11" fill="#18324A" opacity=".055"/>
  <path d="M370 545H470L485 604H355L370 545Z" fill="url(#device-stand)"/>
  <path d="M358 598H482L514 612C516 613 515 618 512 618H328C325 618 324 613 326 612L358 598Z" fill="#E5EAED"/>
  <path d="M334 613H506" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <rect x="28" y="76" width="784" height="478" rx="25" fill="url(#device-rim)" filter="url(#device-shadow)"/>
  <rect x="44" y="94" width="752" height="432" rx="12" fill="#FFFFFF"/>
  <circle cx="420" cy="85" r="2" fill="#586774"/>

  <g clip-path="url(#screen-clip)" font-family="Inter, sans-serif">
    <!-- Native window chrome and quiet navigation. -->
    <path d="M44 94H796V150H44V94Z" fill="#FFFFFF"/>
    <path d="M44 150H796" stroke="#E5EAED"/>
    <circle cx="67" cy="121" r="5" fill="#E5EAED"/>
    <circle cx="84" cy="121" r="5" fill="#E9E0D3"/>
    <circle cx="101" cy="121" r="5" fill="#8FB3A5"/>
    <text x="250" y="127" fill="#18324A" font-size="17" font-weight="600">Vermietung</text>
    <g stroke="#586774" stroke-width="1.6" stroke-linecap="round">
      <rect x="734" y="111" width="17" height="18" rx="3"/>
      <path d="M740 111V129M773 115V125M768 120H778"/>
    </g>
    <path d="M44 150H230V526H44V150Z" fill="#F5F6F7"/>
    <path d="M230 150V526" stroke="#E5EAED"/>
    <text x="64" y="186" fill="#586774" font-size="14" font-weight="500">VERWALTUNG</text>
    <rect x="56" y="201" width="162" height="43" rx="10" fill="#2E8B8B" fill-opacity=".09"/>
    <g stroke="#247777" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 231V216H80V231M80 221H86V231M68 231H88M73 220H76M73 224H76M83 225H84"/>
    </g>
    <text x="98" y="228" fill="#247777" font-size="15" font-weight="600">Immobilien</text>
    <g stroke="#586774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M72 261H81L86 266V280H72V261Z M81 261V266H86M76 270H82M76 274H82"/>
      <circle cx="79" cy="319" r="9"/>
      <path d="M82 315C77 312 74 315 75 319C76 323 79 325 82 322M73 318H80M73 320H80"/>
      <path d="M72 357L75 359L78 357L81 359L84 357V377L81 375L78 377L75 375L72 377V357ZM76 363H81M76 367H81M76 371H79"/>
    </g>
    <text x="98" y="276" fill="#586774" font-size="15">Mietverträge</text>
    <text x="98" y="324" fill="#586774" font-size="15">Mietkonten</text>
    <text x="98" y="372" fill="#586774" font-size="15">Kosten &amp; Belege</text>
    <path d="M64 406H208" stroke="#E5EAED"/>
    <g stroke="#586774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M72 431H78L81 434H88V446H72V431Z"/>
    </g>
    <text x="98" y="444" fill="#586774" font-size="15">Dokumente</text>

    <!-- One clear relationship, without invented business or tenant information. -->
    <text x="256" y="192" fill="#18324A" font-size="24" font-weight="600" letter-spacing="-.6">Alles gehört zusammen.</text>
    <text x="256" y="219" fill="#586774" font-size="15">Ein klarer Blick auf deine Vermietung.</text>

    <g filter="url(#card-shadow)">
      <rect x="256" y="244" width="159" height="222" rx="16" fill="#FFFFFF" stroke="#E5EAED"/>
      <rect x="435" y="244" width="159" height="222" rx="16" fill="#FFFFFF" stroke="#E5EAED"/>
      <rect x="614" y="244" width="159" height="222" rx="16" fill="#FFFFFF" stroke="#E5EAED"/>
    </g>

    <!-- Architecture: two coherent building volumes, a doorway and precise windows. -->
    <rect x="269" y="258" width="133" height="137" rx="11" fill="#F5F6F7"/>
    <path d="M291 375V301L338 285V375H291Z" fill="#E9E0D3"/>
    <path d="M338 285L353 293V375H338V285Z" fill="#8FB3A5"/>
    <path d="M353 319L377 324V375H353V319Z" fill="#E9E0D3"/>
    <path d="M291 301L338 285L353 293" stroke="#18324A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M353 319L377 324V375M291 301V375M338 285V375M353 293V375" stroke="#18324A" stroke-width="1.5"/>
    <g fill="#18324A">
      <path d="M300 310L309 307V320L300 322V310ZM319 304L328 301V316L319 318V304ZM300 334L309 332V345L300 346V334ZM319 330L328 328V343L319 344V330Z"/>
      <path d="M343 307L348 309V321L343 320V307ZM343 332L348 333V346L343 345V332ZM360 337L368 338V349L360 348V337Z"/>
    </g>
    <path d="M316 375V358H329V375" fill="#18324A"/>
    <path d="M283 376H385" stroke="#18324A" stroke-width="2" stroke-linecap="round"/>
    <text x="277" y="424" fill="#18324A" font-size="17" font-weight="600">Immobilie</text>
    <text x="277" y="445" fill="#586774" font-size="14">Dein Bestand</text>

    <!-- Contract: a real document symbol with geometric text rather than fake terms. -->
    <rect x="448" y="258" width="133" height="137" rx="11" fill="#F5F6F7"/>
    <path d="M481 280H531L550 299V374H481V280Z" fill="#FFFFFF" stroke="#8FB3A5" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M531 280V299H550" fill="#E5EAED"/>
    <path d="M531 280V299H550" stroke="#8FB3A5" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="494" y="307" width="40" height="4" rx="2" fill="#18324A"/>
    <g fill="#E5EAED">
      <rect x="494" y="320" width="42" height="3" rx="1.5"/>
      <rect x="494" y="330" width="34" height="3" rx="1.5"/>
      <rect x="494" y="340" width="42" height="3" rx="1.5"/>
    </g>
    <path d="M494 358C499 350 501 350 501 356C501 364 504 355 508 357C511 359 513 354 519 356" stroke="#247777" stroke-width="1.8" stroke-linecap="round"/>
    <text x="456" y="424" fill="#18324A" font-size="17" font-weight="600">Mietvertrag</text>
    <text x="456" y="445" fill="#586774" font-size="14">Klare Zuordnung</text>

    <!-- Rental account: an ordered ledger with no amounts or implied balances. -->
    <rect x="627" y="258" width="133" height="137" rx="11" fill="#F5F6F7"/>
    <rect x="643" y="286" width="100" height="87" rx="10" fill="#FFFFFF" stroke="#E5EAED"/>
    <path d="M643 311H743" stroke="#E5EAED"/>
    <rect x="655" y="297" width="45" height="4" rx="2" fill="#18324A"/>
    <g fill="#E5EAED">
      <rect x="655" y="325" width="40" height="4" rx="2"/>
      <rect x="655" y="340" width="31" height="4" rx="2"/>
      <rect x="655" y="355" width="40" height="4" rx="2"/>
    </g>
    <g fill="#8FB3A5">
      <rect x="716" y="324" width="14" height="6" rx="3"/>
      <rect x="716" y="339" width="14" height="6" rx="3"/>
      <rect x="716" y="354" width="14" height="6" rx="3"/>
    </g>
    <text x="635" y="424" fill="#18324A" font-size="17" font-weight="600">Mietkonto</text>
    <text x="635" y="445" fill="#586774" font-size="14">Zahlungen im Blick</text>

    <!-- Explicit direction carries the property–lease–account story. -->
    <g stroke="#247777" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M416 352H433M427 346L433 352L427 358M595 352H612M606 346L612 352L606 358"/>
    </g>
    <path d="M256 494H773" stroke="#E5EAED"/>
    <g stroke="#586774" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M259 513V506C259 502 267 502 267 506V513M257 508H269V518H257V508Z"/>
    </g>
    <text x="280" y="516" fill="#586774" font-size="14">Persönlich. Auf deinem Mac.</text>
  </g>
  <path d="M385 540H455" stroke="#586774" stroke-width="2" stroke-linecap="round" opacity=".4"/>
</svg>
